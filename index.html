```html
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANHELO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(to bottom,#050505,#111);
font-family:Georgia,serif;
display:flex;
justify-content:center;
align-items:center;
color:#f5e6c8;
position:relative;
}

/* Stars */

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 4s infinite;
}

@keyframes twinkle{
0%,100%{opacity:.2;}
50%{opacity:1;}
}

.container{
text-align:center;
z-index:2;
padding:20px;
max-width:900px;
}

h1{
font-size:6rem;
letter-spacing:12px;
color:#d4af37;
text-shadow:0 0 20px rgba(212,175,55,.6);
margin-bottom:20px;
}

.tagline{
font-style:italic;
font-size:1.2rem;
opacity:.8;
margin-bottom:50px;
}

.quote{
font-size:1.4rem;
line-height:2;
margin-bottom:50px;
}

.enter-btn{
display:inline-block;
padding:16px 40px;
border:1px solid #d4af37;
color:#d4af37;
text-decoration:none;
font-size:1rem;
letter-spacing:2px;
transition:.3s;
border-radius:50px;
}

.enter-btn:hover{
background:#d4af37;
color:black;
}

.footer{
margin-top:40px;
opacity:.5;
font-size:.9rem;
}

</style>
</head>

<body>

<script>
for(let i=0;i<120;i++){
let star=document.createElement("div");
star.className="star";
star.style.width=Math.random()*3+"px";
star.style.height=star.style.width;
star.style.left=Math.random()*100+"%";
star.style.top=Math.random()*100+"%";
star.style.animationDelay=Math.random()*5+"s";
document.body.appendChild(star);
}
</script>

<div class="container">

<h1>ANHELO</h1>

<div class="tagline">
Where longing becomes words, and words become a world.
</div>

<div class="quote">
"काही प्रेमकथा व्यक्तीसाठी लिहिल्या जातात.<br><br>

ही एका भावनेसाठी लिहिली आहे."
</div>

<a href="#" class="enter-btn">
अनाहेलोत प्रवेश करा
</a>

<div class="footer">
— A
</div>

</div>

</body>
</html>
```
